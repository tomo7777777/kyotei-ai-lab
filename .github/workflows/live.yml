name: レース中の自動更新（直前まで動き続ける）

# GitHub の時刻指定は遅れたり抜けたりするため、1回の実行で数時間動き続け、
# その間2分ごとに展示・オッズ・結果を取り込み、約10分ごとに保存する。
on:
  schedule:
    - cron: "30 22 * * *"   # 07:30 JST
    - cron: "0 2 * * *"     # 11:00 JST
    - cron: "30 5 * * *"    # 14:30 JST
    - cron: "0 9 * * *"     # 18:00 JST
  workflow_dispatch:

concurrency:
  group: live
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 2分ごとに更新し、約10分ごとに保存
        run: |
          git config user.name "kyotei-ai-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          save() {
            git add data
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "data: live $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3 4 5; do
              git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && return 0
              sleep $((i * 5))
            done
            git rebase --abort 2>/dev/null || true
          }
          start=$(date +%s)
          last=0
          while true; do
            hm=$(TZ=Asia/Tokyo date +%H%M)
            if [ "$hm" -ge 2235 ] || [ "$hm" -lt 0700 ]; then echo "本日の受付時間外"; break; fi
            if [ $(( $(date +%s) - start )) -gt 20400 ]; then echo "5時間40分たったので次の実行に引き継ぐ"; break; fi
            timeout 600 python scripts/daily.py update || echo "更新に失敗（次の回で再試行）"
            if [ $(( $(date +%s) - last )) -ge 540 ]; then save; last=$(date +%s); fi
            if python scripts/daily.py all_done; then echo "全レースの結果がそろった"; break; fi
            sleep 120
          done
          save
